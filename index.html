<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Expense Tracker</h1>

    <div class="transactions">
        <div class="card income">
            <h3>Total Income</h3>
            <div id="totalIncome" class="amount">$0.00</div>
        </div>

        <div class="card expense">
            <h3>Total Expenses</h3>
            <div id="totalExpenses" class="amount">$0.00</div>
        </div>

        <div id="balanceCard" class="card balance">
            <h3>Total Balance</h3>
            <div id="totalBalance" class="amount">$0.00</div>
        </div>
    </div>

    <div class="dashboard-body">
        <div class="left">
            <div class="panel">
                <h2>Add New Transaction</h2>
                <form id="txForm">
                    <div class="form-group">
                        <label for="desc">Description</label>
                        <input type="text" id="desc" placeholder="" required>
                    </div>

                    <div class="form-group">
                        <label for="amount">Amount ($)</label>
                        <input type="number" id="amount" step="0.01" min="0.01" placeholder="0.00" required>
                    </div>

                    <div class="form-group">
                        <label for="type">Transaction Type</label>
                        <select id="type" required>
                            <option value="income">Income</option>
                            <option value="expense">Expense</option>
                        </select>
                    </div>

                    <button type="submit" class="btn">Save Transaction</button>
                </form>
            </div>

            <div class="panel">
                <h2>Transaction History</h2>
                <ul id="historyList" class="history-list"></ul>
            </div>
        </div>

        <div id="chartPanel" class="panel chart-panel empty">
            <h2>Transactions graph</h2>
            <div class="chart-box">
                <div class="chart-placeholder">No data to display yet</div>
                <canvas id="pieChart" width="260" height="260"></canvas>
                <ul id="legend" class="legend"></ul>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
